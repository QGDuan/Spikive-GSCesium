services:
  gs-platform:
    build: .
    ports:
      - "3000:3000"
    environment:
      GPU_DEVICE: "0"
      MAX_UPLOAD_BYTES: "5368709120"
    volumes:
      - ./var:/app/var
    gpus: all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
